[package]
name = "gabaritei"
version = "0.3.0"
description = "Gabaritei: generate exam questions with AI agents and track performance by topic"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "gabaritei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
schemars = "1.2"
sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
flate2 = "1"
tauri-plugin-dialog = "2"
unicode-normalization = "0.1"
rand = "0.9"
tempfile = "3"
keyring = "4"
ureq = "3"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2"
gethostname = "1.1.0"
same-file = "1.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Enables `tauri::test` (mock runtime) so commands can be exercised through the IPC layer.
tauri = { version = "2", features = ["test"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
