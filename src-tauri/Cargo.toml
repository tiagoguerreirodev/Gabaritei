[package]
name = "gabaritei"
version = "0.1.0"
description = "Gabaritei: generate exam questions with AI agents and track performance by topic"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "gabaritei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

[dev-dependencies]
# Enables `tauri::test` (mock runtime) so commands can be exercised through the IPC layer.
tauri = { version = "2", features = ["test"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
