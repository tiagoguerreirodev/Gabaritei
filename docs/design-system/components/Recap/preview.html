<style>
  body {
    padding: 16px;
    background: var(--bg);
  }
  .card {
    margin: 0;
  }
</style>
<section class="card recap" aria-labelledby="r">
  <h2 id="r">Resultado</h2>
  <p class="recap-headline">Aproveitamento de <strong>70%</strong> em 20 questões.</p>
  <ul class="recap-counts">
    <li class="recap-correct"><span class="recap-glyph" aria-hidden="true">✓</span>14 certas</li>
    <li class="recap-wrong"><span class="recap-glyph" aria-hidden="true">✗</span>5 erradas</li>
    <li class="recap-blank">
      <span class="recap-glyph muted" aria-hidden="true">—</span>1 em branco
    </li>
  </ul>
  <dl class="facts">
    <dt>Modo</dt>
    <dd>Simulado</dd>
    <dt>Caderno</dt>
    <dd>Cebraspe · Atos administrativos</dd>
  </dl>
  <div class="actions" style="display: flex; gap: 8px; margin-top: 16px">
    <a class="btn" href="#">Ver erros</a><a class="btn" href="#">Refazer</a>
  </div>
</section>
