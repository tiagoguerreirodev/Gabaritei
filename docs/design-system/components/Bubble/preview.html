<style>
  body {
    padding: 16px;
    background: var(--bg);
  }
</style>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 6px">
  <button class="bubble bubble-lg">1</button>
  <button class="bubble bubble-lg is-filled">2</button>
  <button class="bubble bubble-lg is-current">3</button>
  <button class="bubble bubble-lg is-filled">
    4<span class="bubble-mark is-flag" aria-hidden="true">⚑</span>
  </button>
  <button class="bubble bubble-lg is-correct">
    5<span class="bubble-mark" aria-hidden="true">✓</span>
  </button>
  <button class="bubble bubble-lg is-wrong">
    6<span class="bubble-mark" aria-hidden="true">✗</span>
  </button>
  <button class="bubble bubble-lg is-annulled">7</button>
  <span style="width: 16px"></span>
  <span class="bubble">A</span><span class="bubble is-filled">B</span
  ><span class="bubble is-key">C</span>
</div>
