name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Caching notes: CI runs only on pull requests, not on pushes to main. A PR run can restore
# caches saved by the same PR, so the first run of each PR compiles every dependency
# (Tauri + WebKitGTK) from scratch.
env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust lint (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        # Debian/Ubuntu list from https://v2.tauri.app/start/prerequisites/
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Line tables keep file:line in panics and backtraces but compile, link and cache
      # much faster than full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        # Debian/Ubuntu list from https://v2.tauri.app/start/prerequisites/
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: TypeScript bindings are up to date
        # `cargo test` regenerates src/bindings/ from the Rust types (ts-rs).
        run: |
          if [ -n "$(git status --porcelain -- src/bindings)" ]; then
            git status --short -- src/bindings
            git diff -- src/bindings
            echo "::error::src/bindings/ is stale. Run 'cargo test' and commit the result."
            exit 1
          fi

  rust-test-windows:
    name: Rust tests (Windows)
    # The AI runner is only exercised for real on Windows here: .cmd shims, argument escaping
    # and the process-tree kill (issue #49). Unix-only fake CLIs are skipped on this platform.
    # windows-latest is billed at 2x, so docs-only and frontend-only PRs skip the work. The job
    # itself always runs (a `paths` filter on the workflow would leave this required check
    # pending forever); only its steps are skipped, so the job still reports success.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pushes to main always run the full suite. A PR runs it when it touches the Rust
          # backend, the cargo config, the toolchain pin, or this workflow.
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD")
          echo "$files"
          if grep -qE '^(src-tauri/|\.cargo/|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes: skipping the Windows tests."
          fi

      - name: Install Rust toolchain (from rust-toolchain.toml)
        if: steps.changes.outputs.backend == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.backend == 'true'
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: cargo test
        if: steps.changes.outputs.backend == 'true'
        # The manifest makes the lib test executable start (see src-tauri/build.rs). The app's
        # own executable already has one, so only the lib tests run here.
        env:
          GABARITEI_TEST_MANIFEST: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: cargo clippy (lints the cfg(windows) code)
        if: steps.changes.outputs.backend == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
