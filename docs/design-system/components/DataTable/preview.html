<style>
  body {
    padding: 16px;
    background: var(--bg);
  }
  .card {
    margin: 0;
  }
</style>
<section class="card card-wide" aria-labelledby="tt">
  <h2 id="tt">Por área, matéria e assunto</h2>
  <div class="table-scroll" role="region" tabindex="0" aria-labelledby="tt">
    <table class="data-table">
      <thead>
        <tr>
          <th scope="col">Assunto</th>
          <th scope="col">Respondidas</th>
          <th scope="col">Acerto</th>
          <th scope="col">Aproveitamento</th>
        </tr>
      </thead>
      <tbody>
        <tr class="level-area">
          <th scope="row">Direito</th>
          <td>212</td>
          <td>76%</td>
          <td>
            <span class="table-meter"
              ><span class="meter-track"><span class="meter-fill" style="width: 71%"></span></span
              ><span class="meter-value">71%</span></span
            >
          </td>
        </tr>
        <tr class="level-matter">
          <th scope="row">Direito Administrativo</th>
          <td>130</td>
          <td>79%</td>
          <td>
            <span class="table-meter"
              ><span class="meter-track"><span class="meter-fill" style="width: 74%"></span></span
              ><span class="meter-value">74%</span></span
            >
          </td>
        </tr>
        <tr class="level-topic">
          <th scope="row">Atos administrativos</th>
          <td>48</td>
          <td>62%</td>
          <td>
            <span class="table-meter"
              ><span class="meter-track"><span class="meter-fill" style="width: 55%"></span></span
              ><span class="meter-value">55%</span></span
            >
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
