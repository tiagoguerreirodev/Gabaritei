<!-- @dsCard group="Screens" height=820 width=1000 -->
<style>
  body {
    padding: 32px 40px;
    background: var(--bg);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    line-height: 1.25;
  }
  p.lead {
    margin: 0 0 32px;
    color: var(--muted);
  }
  textarea.input {
    min-height: 5rem;
    resize: vertical;
  }
  details summary {
    cursor: pointer;
  }
</style>
<h1>Gerar questões</h1>
<p class="lead">As questões passam por verificação cega antes de entrar no banco.</p>
<form class="form" onsubmit="return false;">
  <fieldset class="form-section">
    <legend class="form-section-title label">
      <span class="form-section-number">1</span>Assunto
    </legend>
    <div class="form-row">
      <label class="field"
        ><span class="field-label">Área</span><input class="input" value="Direito"
      /></label>
      <label class="field"
        ><span class="field-label">Matéria</span><input class="input" value="Administrativo"
      /></label>
      <label class="field"
        ><span class="field-label">Assunto</span><input class="input" value="Atos administrativos"
      /></label>
    </div>
  </fieldset>
  <fieldset class="form-section">
    <legend class="form-section-title label">
      <span class="form-section-number">2</span>Quantidade e banca
    </legend>
    <div class="form-row">
      <label class="field"
        ><span class="field-label">Quantidade</span><input class="input" value="10" /><span
          class="field-hint"
          >De 1 a 50.</span
        ></label
      >
      <label class="field"
        ><span class="field-label">Formato</span
        ><select class="input">
          <option>Certo/Errado</option>
          <option>Múltipla escolha</option>
        </select></label
      >
      <label class="field"
        ><span class="field-label"
          >Banca <span class="muted" style="font-weight: 400">(opcional)</span></span
        ><select class="input">
          <option>Cebraspe</option>
        </select></label
      >
    </div>
  </fieldset>
  <fieldset class="form-section">
    <legend class="form-section-title label">
      <span class="form-section-number">3</span>Fontes
    </legend>
    <label class="field" style="max-width: none"
      ><span class="field-label"
        >Instruções e trechos de lei
        <span class="muted" style="font-weight: 400">(opcional)</span></span
      ><textarea class="input">Foco na Lei 9.784/1999, arts. 53 a 55.</textarea>
    </label>
    <div><button class="btn" type="button">Anexar arquivo</button></div>
  </fieldset>
  <details class="form-section">
    <summary class="form-section-title label">
      <span class="form-section-number">4</span>Avançado
    </summary>
  </details>
  <div class="form-actions"><button class="btn btn-primary">Gerar questões</button></div>
</form>
