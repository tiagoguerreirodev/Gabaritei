<style>
  body {
    padding: 16px;
    background: var(--bg);
  }
</style>
<ul class="options" style="max-width: var(--measure)">
  <li>
    <button class="option">
      <span class="bubble">A</span
      ><span class="option-text">O ato vinculado admite juízo de conveniência e oportunidade.</span>
    </button>
  </li>
  <li>
    <button class="option is-wrong">
      <span class="bubble is-filled is-wrong">B</span
      ><span class="option-text">A revogação produz efeitos retroativos.</span
      ><span class="option-note">Sua resposta</span>
    </button>
  </li>
  <li>
    <button class="option is-correct">
      <span class="bubble is-key">C</span
      ><span class="option-text"
        >A anulação pode ser feita pela própria Administração, de ofício.</span
      ><span class="option-note">Gabarito</span>
    </button>
  </li>
  <li>
    <button class="option is-eliminated">
      <span class="bubble">D</span
      ><span class="option-text">A homologação é ato discricionário.</span>
    </button>
  </li>
  <li>
    <button class="option is-selected">
      <span class="bubble is-filled">E</span
      ><span class="option-text">A convalidação alcança vícios de competência exclusiva.</span>
    </button>
  </li>
</ul>
