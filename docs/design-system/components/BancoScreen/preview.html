<!-- @dsCard group="Screens" height=820 width=1200 -->
<style>
  body {
    padding: 32px 40px;
    background: var(--bg);
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    line-height: 1.25;
  }
  .head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    max-width: var(--content-width-wide);
    margin-bottom: 24px;
  }
</style>
<div class="head">
  <h1>Banco</h1>
  <div class="bank-presets">
    <button class="btn" aria-pressed="true">
      Revisões de hoje <span class="badge badge-count">9</span>
    </button>
    <button class="btn" aria-pressed="false">
      Caderno de erros <span class="badge badge-count">22</span>
    </button>
  </div>
</div>
<div class="bank-layout">
  <form class="card filter-panel" onsubmit="return false;">
    <fieldset class="filter-group">
      <legend class="label">Assuntos</legend>
      <ul class="check-tree">
        <li>
          <details>
            <summary>
              <label class="check-item"
                ><input type="checkbox" /><span class="check-label">Direito Administrativo</span
                ><span class="check-count">96</span></label
              >
            </summary>
          </details>
        </li>
        <li>
          <details>
            <summary>
              <label class="check-item"
                ><input type="checkbox" /><span class="check-label">Direito Constitucional</span
                ><span class="check-count">44</span></label
              >
            </summary>
          </details>
        </li>
        <li>
          <details>
            <summary>
              <label class="check-item"
                ><input type="checkbox" /><span class="check-label">Português</span
                ><span class="check-count">120</span></label
              >
            </summary>
          </details>
        </li>
      </ul>
    </fieldset>
    <fieldset class="filter-group">
      <legend class="label">Status</legend>
      <label class="check-item"
        ><input type="checkbox" /><span class="check-label">Nunca resolvidas</span
        ><span class="check-count">131</span></label
      >
      <label class="check-item"
        ><input type="checkbox" checked /><span class="check-label">Erradas</span
        ><span class="check-count">22</span></label
      >
      <label class="check-item"
        ><input type="checkbox" /><span class="check-label">Em branco</span
        ><span class="check-count">4</span></label
      >
      <label class="check-item"
        ><input type="checkbox" checked /><span class="check-label">Revisão vencida</span
        ><span class="check-count">9</span></label
      >
      <label class="check-item"
        ><input type="checkbox" /><span class="check-label">Sinalizadas</span
        ><span class="check-count">3</span></label
      >
    </fieldset>
    <fieldset class="filter-group">
      <legend class="label">Caderno</legend>
      <span><button class="btn" type="button">Escolher caderno</button></span>
    </fieldset>
    <div class="filter-panel-footer">
      <button class="btn btn-link is-inline" type="button">Limpar filtros</button>
    </div>
  </form>
  <section class="card result-panel" aria-label="Resultado">
    <div>
      <p class="result-count">28 questões</p>
      <p class="result-note">3 em tentativa aberta ficam de fora.</p>
    </div>
    <ul class="breakdown" aria-label="Por área e status">
      <li class="card card-compact stat">
        <span class="stat-name">Administrativo</span><span class="stat-value">17</span>
      </li>
      <li class="card card-compact stat">
        <span class="stat-name">Constitucional</span><span class="stat-value">11</span>
      </li>
      <li class="card card-compact stat">
        <span class="stat-name">Revisão vencida</span><span class="stat-value">9</span>
      </li>
      <li class="card card-compact stat">
        <span class="stat-name">Erradas</span><span class="stat-value">22</span>
      </li>
    </ul>
    <form class="result-settings" onsubmit="return false;">
      <div class="form-row">
        <label class="field"
          ><span class="field-label">Quantas</span
          ><input class="input" type="number" value="20" /><span class="field-hint"
            >Até 25.</span
          ></label
        >
        <label class="field"
          ><span class="field-label">Ordem</span
          ><select class="input">
            <option>Revisões primeiro</option>
            <option>Mais recentes primeiro</option>
            <option>Não vistas primeiro</option>
            <option>Aleatória</option>
          </select></label
        >
      </div>
      <fieldset class="radio-row">
        <legend>Modo</legend>
        <label><input type="radio" name="m" checked />Estudo</label
        ><label><input type="radio" name="m" />Simulado</label>
      </fieldset>
      <div class="result-actions"><button class="btn btn-primary">Resolver estas</button></div>
    </form>
  </section>
</div>
