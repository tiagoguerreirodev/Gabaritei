<style>
  body {
    padding: 24px;
    background: var(--bg);
  }
</style>
<article class="sheet" style="max-width: var(--sheet-width)">
  <header class="sheet-header">
    <span class="label">Questão 12 · Direito Administrativo</span
    ><span style="display: flex; align-items: center; gap: 12px"
      ><span class="label">Cebraspe · Múltipla escolha</span
      ><button class="btn btn-ghost" aria-pressed="false">⚑ Marcar</button></span
    >
  </header>
  <span class="sheet-number" aria-hidden="true">12</span>
  <p class="sheet-stem">
    Acerca dos atos administrativos e de seu desfazimento, assinale a opção correta.
  </p>
  <ul class="options">
    <li>
      <button class="option">
        <span class="bubble">A</span
        ><span class="option-text"
          >O ato vinculado admite juízo de conveniência e oportunidade.</span
        >
      </button>
    </li>
    <li>
      <button class="option is-selected">
        <span class="bubble is-filled">B</span
        ><span class="option-text"
          >A anulação pode ser feita pela própria Administração, de ofício.</span
        >
      </button>
    </li>
    <li>
      <button class="option">
        <span class="bubble">C</span
        ><span class="option-text">A revogação produz efeitos retroativos.</span>
      </button>
    </li>
  </ul>
  <footer class="sheet-footer">
    <button class="btn">Anterior</button><button class="btn btn-primary">Confirmar resposta</button>
  </footer>
</article>
